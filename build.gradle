plugins {
    id 'java'
    id 'war'
}

group 'com.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.10.2'
}

sourceCompatibility = '22'
targetCompatibility = '22'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {
    compileOnly('jakarta.servlet:jakarta.servlet-api:5.0.0')
    implementation 'jakarta.servlet:jakarta.servlet-api:5.0.0'
//  Hai dòng này là khai báo để thêm JSTL vào dự án của bạn.
//          JSTL API cung cấp các giao diện chuẩn cho các thẻ JSP.
//  Glassfish implementation giúp thực hiện các logic khi sử dụng các thẻ JSTL trong ứng dụng JSP.
    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:2.0.0'
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:2.0.0'



    // Thêm JDBC (ví dụ với MySQL)
    implementation 'mysql:mysql-connector-java:8.0.32'
    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")
}

test {
    useJUnitPlatform()
}